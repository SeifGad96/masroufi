name: masroufi
description: "مصروفي — Personal monthly expense tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking (for News feed - M5)
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  json_annotation: ^4.9.0

  # Utilities
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  retrofit_generator: ^9.1.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
